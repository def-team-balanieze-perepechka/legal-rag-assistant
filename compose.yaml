x-common: &common
  build:
    context: .
    dockerfile: Dockerfile
  image: legal-assistant:local
  env_file:
    - path: .env
      required: false
  extra_hosts:
    - "host.docker.internal:host-gateway"
  volumes:
    - ./data:/data:ro
  cpus: 8
  mem_limit: 16g

services:
  solution:
    <<: *common
    environment:
      DATA_DIR: /data
      SUBMISSION_PATH: /out/submission.csv
    volumes:
      - ./data:/data:ro
      - ./out:/out
    user: "${LOCAL_UID:-10001}:${LOCAL_GID:-10001}"
    command: ["python", "solution.py"]

  api:
    profiles: ["web"]
    environment:
      DATA_DIR: /data
    ports:
      - "8000:8000"
    command: ["uvicorn", "api.main:app", "--host", "0.0.0.0", "--port", "8000"]
    healthcheck:
      test:
        [
          "CMD",
          "python",
          "-c",
          "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/health', timeout=2)"
        ]
      interval: 10s
      timeout: 3s
      retries: 5
      start_period: 20s